<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Whatiff Matrix</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cormorant+SC:wght@600;700&family=Share+Tech+Mono&display=swap">
  <link rel="icon" type="image/png" href="whatiff-matrix.png">
</head>
<body>
  <app-root></app-root>
<canvas id="matrix-rain" aria-hidden="true" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:-1;opacity:0.7;"></canvas>
<script>
(function(){
var c=document.getElementById('matrix-rain'),x=c.getContext('2d');
var G='0123456789ABCDEF<>=#*/+-';
var fs=14,cols=0,drops=[],W=0,H=0;
function size(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;cols=Math.floor(W/fs);drops=[];for(var i=0;i<cols;i++){drops[i]=Math.floor(Math.random()*-120);}}
size();window.addEventListener('resize',size);
setInterval(function(){
x.clearRect(0,0,W,H);x.font=fs+'px monospace';
for(var i=0;i<cols;i++){
var y=drops[i]*fs;
if(y>0&&y<H+fs){x.shadowColor='#00FF41';x.shadowBlur=8;x.fillStyle='#00FF41';x.fillText(G[Math.floor(Math.random()*G.length)],i*fs,y);
x.shadowBlur=0;for(var t=1;t<5;t++){var ty=y-t*fs;if(ty>0){x.fillStyle='rgba(0,255,65,'+(0.45-t*0.09)+')';x.fillText(G[Math.floor(Math.random()*G.length)],i*fs,ty);}}}
drops[i]+=Math.random()<0.08?2:1;
if(y>H+300+Math.random()*900){drops[i]=Math.floor(Math.random()*-80);}
}
},66);
})();
</script></body>
</html>
